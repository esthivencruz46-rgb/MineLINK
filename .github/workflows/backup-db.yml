name: Respaldo diario de la base de datos

# Corre solo (3:00 am hora Perú = 8:00 UTC) y también se puede disparar a
# mano desde la pestaña "Actions" del repo con "Run workflow". Usa pg_dump
# contra la Supabase de producción y guarda el resultado como artefacto de
# GitHub (90 días de retención — el máximo permitido).
#
# Requiere el secret DATABASE_URL_BACKUP configurado en:
# Settings → Secrets and variables → Actions → New repository secret
# (mismo valor que backend/.env, DATABASE_URL — cadena de Postgres de
# Supabase). Sin ese secret el job falla con un mensaje claro en vez de
# quedarse en silencio.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # postgresql-client 17 desde el repositorio oficial de PostgreSQL
      # (PGDG): el runner de GitHub trae la versión 16 y pg_dump se niega
      # a respaldar un servidor más nuevo que él ("server version
      # mismatch") — Supabase corre PostgreSQL 17 (verificado julio 2026,
      # causa del fallo de la corrida #1).
      - name: Instalar cliente de Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Generar el dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_BACKUP }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Falta el secret DATABASE_URL_BACKUP en la configuración del repositorio (Settings > Secrets and variables > Actions)." >&2
            exit 1
          fi
          # Ruta explícita al binario 17 — el wrapper `pg_dump` de Ubuntu
          # podría seguir apuntando a la 16 preinstalada del runner.
          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
          "$PG_DUMP" --version
          FECHA=$(date +%Y-%m-%d_%H%M)
          echo "NOMBRE_ARCHIVO=minelink_backup_${FECHA}" >> "$GITHUB_ENV"
          "$PG_DUMP" "$DATABASE_URL" --no-owner --no-privileges -F c -f "minelink_backup_${FECHA}.dump"

      - name: Subir el respaldo como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOMBRE_ARCHIVO }}
          path: ${{ env.NOMBRE_ARCHIVO }}.dump
          retention-days: 90
