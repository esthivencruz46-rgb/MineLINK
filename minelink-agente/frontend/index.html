<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MineLink — Formaliza tu minería y conecta con inversionistas</title>
    <!-- Ícono de la pestaña del navegador + ícono al anclar en un iPhone
         (generados de la marca: M dorada sobre verde institucional). -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Verificación de propiedad ante Google Search Console (julio 2026,
         cuenta del proyecto) — NO borrar: si esta etiqueta desaparece,
         Google revoca la verificación del sitio. -->
    <meta name="google-site-verification" content="Gy1oxoMDR-i6MVvaLVzoVKS0yarfRGhUylwicoSBe9s" />
    <!-- SEO básico (julio 2026): la descripción es lo que Google muestra
         debajo del título en los resultados; sin ella inventa un texto
         cualquiera sacado de la página. Los og: controlan la tarjeta de
         vista previa al compartir el enlace por WhatsApp/Facebook. -->
    <meta
      name="description"
      content="Diagnóstico gratuito de formalización para mineros artesanales del Perú: descubre en qué paso estás (REINFO, IGAFOM, concesión), qué te falta y quién te ayuda. Proyectos mineros verificados para inversionistas."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MineLink" />
    <meta property="og:title" content="MineLink — Formaliza tu minería y conecta con inversionistas" />
    <meta
      property="og:description"
      content="Diagnóstico gratuito de formalización minera en Perú y cartera de proyectos verificados para inversionistas."
    />
    <meta property="og:url" content="https://mine-link-seven.vercel.app/" />
    <meta property="og:locale" content="es_PE" />
    <!-- La imagen de la tarjeta de vista previa al compartir el enlace
         por WhatsApp/Facebook — sin ella el link sale "pelado". -->
    <meta property="og:image" content="https://mine-link-seven.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Datos estructurados (agosto 2026): le dan a Google el nombre y la
         descripción exactos de la marca en los resultados, en vez de que
         invente un título de la página. Mantener name/url en sync con los
         og: de arriba. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "MineLink",
            "url": "https://mine-link-seven.vercel.app/",
            "description": "Diagnóstico gratuito de formalización para mineros artesanales del Perú y cartera de proyectos mineros verificados para inversionistas.",
            "inLanguage": "es-PE"
          },
          {
            "@type": "Organization",
            "name": "MineLink",
            "url": "https://mine-link-seven.vercel.app/",
            "logo": "https://mine-link-seven.vercel.app/icono-512.png"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
